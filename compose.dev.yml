services:
  how-llms-work:
    build:
      context: .
    command: flask --app app run --debug --host=0.0.0.0 --port=8080
    environment:
      FLASK_ENV: development
    ports:
      - "127.0.0.1:${DEV_PORT:-18083}:8080"
    volumes:
      - .:/app
      - ${DEV_DATA_DIR:-./data}:/app/data:ro

  test:
    build:
      context: .
    command: python -m pytest tests/ -v
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      FLASK_ENV: development
    volumes:
      - .:/app
